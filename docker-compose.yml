services:
  db:
    image: postgres:16
    container_name: pg-notes
    restart: unless-stopped
    environment:
      POSTGRES_DB: notes_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d notes_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data: